{% extends "base.html" %}

{% block title %}Send Message - SF TENNIS KIDS Club{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 lg:px-10 pb-32 lg:pb-24">
  <div class="flex flex-col md:flex-row items-center justify-between gap-4 lg:gap-6 mb-6 lg:mb-12">
    <div class="flex items-center gap-3 lg:gap-4">
      <span class="w-8 lg:w-12 h-1 bg-accent rounded-full"></span>
      <h1 class="text-2xl lg:text-4xl font-black text-navy font-serif tracking-tight">Broadcast Alert</h1>
    </div>
    <a href="{{ url_for('dashboard') }}"
      class="px-4 lg:px-8 py-2 lg:py-3 text-sm font-bold text-obsidian/40 hover:text-obsidian transition-colors flex items-center gap-2">
      <span class="material-symbols-outlined">arrow_back</span> <span class="hidden sm:inline">Back</span>
    </a>
  </div>

  <div class="card-premium border border-navy/10 shadow-2xl p-0 overflow-hidden bg-white">
    <div class="bg-navy p-6 lg:p-10 text-white relative">
      <h3 class="text-xl lg:text-3xl font-black font-serif mb-1 lg:mb-2">Compose Broadcast</h3>
      <p class="text-white/60 text-sm lg:text-lg">Send notifications via email to select groups or the entire club.</p>
      <div class="absolute -right-4 lg:-right-8 -bottom-4 lg:-bottom-8 opacity-5">
        <span class="material-symbols-outlined !text-[6rem] lg:!text-[12rem]">broadcast_on_home</span>
      </div>
    </div>

    <form method="POST" class="p-4 lg:p-12 space-y-6 lg:space-y-10">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-10">
        <div class="space-y-2 lg:space-y-3">
          <label class="text-[10px] lg:text-xs font-black text-accent uppercase tracking-[0.2em] ml-2 lg:ml-4">Message Type *</label>
          <select id="message_type" name="message_type" class="form-input text-base lg:text-lg py-3 lg:py-4" required>
            <option value="">Select type...</option>
            <option value="announcement">Announcement</option>
            <option value="rain_cancellation">Rain Cancellation</option>
            <option value="coach_delay">Coach Delay</option>
            <option value="schedule_change">Schedule Change</option>
          </select>
        </div>

        <div class="space-y-2 lg:space-y-3">
          <label class="text-[10px] lg:text-xs font-black text-accent uppercase tracking-[0.2em] ml-2 lg:ml-4">Target Audience</label>
          <select id="group_id" name="group_id" class="form-input text-base lg:text-lg py-3 lg:py-4 border-dashed" required>
            <option value="">-- All Club Families --</option>
            {% for group in groups %}
              {% if group.schedule_id %}
                <option value="{{ group.group_id }}" data-schedule-id="{{ group.schedule_id }}">
                  {{ group.group_name }} — {{ ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][group.day_of_week] }} {{ group.start_time }}
                </option>
              {% else %}
                <option value="{{ group.group_id }}">{{ group.group_name }}</option>
              {% endif %}
            {% endfor %}
          </select>
          <input type="hidden" name="schedule_id" id="schedule_id" value="">
        </div>
      </div>

      <div class="space-y-2 lg:space-y-3">
        <label class="text-[10px] lg:text-xs font-black text-accent uppercase tracking-[0.2em] ml-2 lg:ml-4">Subject Header *</label>
        <div class="relative">
          <input type="text" name="subject" class="form-input text-base lg:text-lg py-3 lg:py-4 pr-10 lg:pr-12"
            placeholder="e.g., Session Cancelled Due to Rain" required>
          <span class="absolute right-3 lg:right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-navy/20">title</span>
        </div>
      </div>

      <div class="space-y-2 lg:space-y-3 relative">
        <label class="text-[10px] lg:text-xs font-black text-accent uppercase tracking-[0.2em] ml-2 lg:ml-4">Email Content *</label>
        <textarea id="content" name="content" class="form-input h-40 lg:h-64 text-base lg:text-lg py-4 lg:py-6 resize-none"
          placeholder="Write your message here..."
          required></textarea>
        <!-- Magic Draft Button -->
        <button type="button" id="magic_draft_btn"
          class="absolute bottom-3 lg:bottom-4 right-3 lg:right-4 bg-gradient-to-r from-accent to-navy text-white px-3 lg:px-4 py-2 rounded-full font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-1 lg:gap-2 text-xs lg:text-sm z-10">
          <span class="material-symbols-outlined text-base lg:text-[1.2rem]">magic_button</span> <span class="hidden sm:inline">Magic Draft</span>
        </button>
      </div>

      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 lg:gap-8 pt-4 lg:pt-6 border-t border-navy/5">
        <div class="flex items-start gap-3 lg:gap-4">
          <label class="relative flex items-start gap-3 lg:gap-4 cursor-pointer group">
            <input type="checkbox" name="is_general"
              class="w-5 lg:w-6 h-5 lg:h-6 rounded-lg border-2 border-navy/10 text-navy focus:ring-navy transition-all cursor-pointer mt-0.5">
            <span class="text-xs lg:text-sm font-bold text-navy/60 group-hover:text-navy transition-colors">
              Send to ALL families
            </span>
          </label>
        </div>

        <div class="flex items-center gap-3 lg:gap-6 w-full md:w-auto">
          <a href="{{ url_for('dashboard') }}"
            class="px-6 lg:px-10 py-3 lg:py-4 text-sm font-bold text-obsidian/40 hover:text-obsidian transition-colors">
            Cancel
          </a>
          <button type="submit"
            class="btn-primary !px-8 lg:!px-12 !py-3 lg:!py-5 text-base lg:text-lg shadow-2xl hover:shadow-accent/40 w-full md:w-auto justify-center">
            <span class="material-symbols-outlined">send</span> Send
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const magicBtn = document.getElementById('magic_draft_btn');
    const contentTextarea = document.getElementById('content');
    const subjectInput = document.querySelector('input[name="subject"]');
    const messageTypeSelect = document.getElementById('message_type');
    const groupSelect = document.getElementById('group_id');
    const scheduleIdInput = document.getElementById('schedule_id');

    // Update hidden schedule_id when group selection changes
    if (groupSelect && scheduleIdInput) {
      groupSelect.addEventListener('change', () => {
        const selectedOption = groupSelect.options[groupSelect.selectedIndex];
        scheduleIdInput.value = selectedOption.dataset.scheduleId || '';
      });
    }

    if (magicBtn && contentTextarea && subjectInput && messageTypeSelect) {
      magicBtn.addEventListener('click', async () => {
        const notes = contentTextarea.value.trim();
        const messageType = messageTypeSelect.value;

        if (!notes) {
          alert('Please enter some rough notes in the content area first.');
          return;
        }

        const originalText = magicBtn.innerHTML;
        magicBtn.innerHTML = '<span class="material-symbols-outlined text-[1.2rem] animate-spin">refresh</span> Drafting...';
        magicBtn.disabled = true;

        try {
          const response = await fetch('/api/draft-message', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              notes: notes,
              message_type: messageType || 'general_update'
            })
          });

          const data = await response.json();

          if (response.ok) {
            subjectInput.value = data.subject || subjectInput.value;
            contentTextarea.value = data.content || contentTextarea.value;
          } else {
            const status = response.status;
            if (status === 503) {
              alert(data.error || 'Magic Draft is unavailable right now. Please ask admin to verify Gemini API key settings.');
            } else if (status === 502) {
              alert(data.error || 'Magic Draft provider is temporarily unavailable. Please try again in a moment.');
            } else {
              alert('Error: ' + (data.error || 'Failed to generate draft'));
            }
          }
        } catch (error) {
          console.error('Error drafting message:', error);
          alert('An error occurred while drafting the message.');
        } finally {
          magicBtn.innerHTML = originalText;
          magicBtn.disabled = false;
        }
      });
    }
  });
</script>
{% endblock %}
