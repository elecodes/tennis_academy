<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>SF Tennis Kids - Ask us</title>
  <style>
    :root { --navy: #0d47a1; --yellow: #ffd600; --fog: #f4f7f6; --ink: #1b2430; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
    header { background: var(--navy); color: #fff; padding: 12px 16px; border-bottom: 3px solid var(--yellow); }
    header strong { display: block; font-size: 16px; }
    header span { font-size: 12px; opacity: .85; }
    #log { flex: 1; overflow-y: auto; padding: 14px; background: var(--fog); display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; line-height: 1.4; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bot { background: #fff; border: 1px solid #dde4e8; align-self: flex-start; border-bottom-left-radius: 4px; }
    .me { background: var(--navy); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg a { color: var(--navy); text-decoration: underline; }
    .err { background: #fff3f0; border: 1px solid #f3c1b6; color: #7a2a18; align-self: flex-start; }
    .menu { display: flex; flex-direction: column; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { border: 1px solid var(--navy); background: #fff; color: var(--navy); border-radius: 999px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
    .chips button:hover { background: #e8f0fb; }
    .back { align-self: flex-start; border: 0; background: none; color: var(--navy); font: inherit; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px 2px; }
    form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #dde4e8; background: #fff; }
    input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid #b9c4cc; border-radius: 10px; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
    form button { background: var(--navy); color: #fff; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
    form button:disabled { opacity: .5; cursor: default; }
    footer { padding: 6px 12px 10px; font-size: 11px; color: #5b6770; background: #fff; text-align: center; }
    footer a { color: var(--navy); }
  </style>
</head>
<body>
  <header>
    <strong>SF Tennis Kids Club</strong>
    <span>Ask about lessons, ages and prices</span>
  </header>

  <div id="log" role="log" aria-live="polite">
    <div class="msg bot">Hi! I can answer questions about our tennis lessons, ages, prices and summer camp. I can't book lessons, but I'll point you to the right place.</div>
  </div>

  <form id="form" autocomplete="off">
    <input id="input" type="text" maxlength="{{ max_chars }}" placeholder="Type your question..." aria-label="Your question">
    <button id="send" type="submit">Send</button>
  </form>
  <footer>Information only. Questions? Call/text <a href="tel:4157075437">415-707-5437</a> (Mon-Fri 9am-12pm) or <a href="mailto:info@sanfranciscokids.tennis">email us</a>.</footer>

  <script>
    (function () {
      var log = document.getElementById("log");
      var form = document.getElementById("form");
      var input = document.getElementById("input");
      var send = document.getElementById("send");
      var history = [];
      var busy = false;

      var suggestions = [
        "What lessons are available for my child's age?",
        "How much are group lessons?",
        "Private and semi-private prices?",
        "Tell me about Parent & Me",
        "What are the class days and times?",
        "Summer camp 2027",
        "Cancellations and rain-outs",
        "What should my child bring?",
        "How do I sign up?"
      ];

      var menu = null;
      var backBtn = null;

      function clearMenu() {
        if (menu && menu.parentNode) menu.parentNode.removeChild(menu);
        if (backBtn && backBtn.parentNode) backBtn.parentNode.removeChild(backBtn);
        menu = null;
        backBtn = null;
      }

      // Shows the list of suggested questions at the bottom of the chat. Returns the first button.
      function showMenu(intro) {
        clearMenu();
        menu = document.createElement("div");
        menu.className = "menu";
        if (intro) {
          var msg = document.createElement("div");
          msg.className = "msg bot";
          msg.textContent = intro;
          menu.appendChild(msg);
        }
        var chips = document.createElement("div");
        chips.className = "chips";
        suggestions.forEach(function (text) {
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = text;
          b.addEventListener("click", function () { ask(text); });
          chips.appendChild(b);
        });
        menu.appendChild(chips);
        log.appendChild(menu);
        log.scrollTop = log.scrollHeight;
        return chips.firstChild;
      }

      // After every answer (or error) the visitor can go back to the list of questions.
      // The conversation stays on screen and the bot keeps its context.
      function showBackButton() {
        if (backBtn && backBtn.parentNode) backBtn.parentNode.removeChild(backBtn);
        backBtn = document.createElement("button");
        backBtn.type = "button";
        backBtn.className = "back";
        backBtn.textContent = "\u2190 Back to menu";
        backBtn.addEventListener("click", function () {
          var first = showMenu("What else would you like to know?");
          if (first) first.focus();
        });
        log.appendChild(backBtn);
        log.scrollTop = log.scrollHeight;
      }

      // Bot replies: turn **bold**, [text](url) and plain http(s) URLs into DOM nodes.
      // Built with createElement/textContent only (never innerHTML), so model output cannot inject HTML.
      var TOKEN = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|\*\*([^*]+)\*\*|(https?:\/\/[^\s<>"')\]]+)/g;

      function link(url, label) {
        var a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = label;
        return a;
      }

      function render(el, text) {
        var last = 0, m;
        TOKEN.lastIndex = 0;
        while ((m = TOKEN.exec(text)) !== null) {
          if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
          if (m[2]) {
            el.appendChild(link(m[2], m[1]));
          } else if (m[3]) {
            var strong = document.createElement("strong");
            strong.textContent = m[3];
            el.appendChild(strong);
          } else {
            var url = m[4], tail = "";
            var punct = url.match(/[.,;:!?]+$/);
            if (punct) { tail = punct[0]; url = url.slice(0, -tail.length); }
            el.appendChild(link(url, url));
            if (tail) el.appendChild(document.createTextNode(tail));
          }
          last = TOKEN.lastIndex;
        }
        if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
      }

      function add(cls, text) {
        var el = document.createElement("div");
        el.className = "msg " + cls;
        if (cls === "bot") render(el, text);
        else el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      function ask(text) {
        text = (text || "").trim();
        if (!text || busy) return;
        clearMenu();
        busy = true;
        send.disabled = true;
        input.value = "";
        add("me", text);
        history.push({ role: "user", content: text });
        var typing = add("bot", "...");

        fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-6) })
        })
          .then(function (r) {
            return r.json().then(function (data) { return { ok: r.ok, data: data }; });
          })
          .then(function (res) {
            log.removeChild(typing);
            if (res.ok && res.data.reply) {
              add("bot", res.data.reply);
              history.push({ role: "assistant", content: res.data.reply });
            } else {
              history.pop();
              add("err", (res.data && res.data.error) || "Something went wrong. Please try again.");
            }
          })
          .catch(function () {
            log.removeChild(typing);
            history.pop();
            add("err", "I couldn't connect. Please check your connection and try again.");
          })
          .then(function () {
            busy = false;
            send.disabled = false;
            showBackButton();
            input.focus();
          });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        ask(input.value);
      });

      showMenu();
    })();
  </script>
</body>
</html>
