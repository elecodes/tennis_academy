{% extends "base.html" %}

{% block title %}New Session - SF TENNIS KIDS Club{% endblock %}

{% block content %}
{% include 'dashboard_header.html' %}

<div class="max-w-2xl mx-auto px-10 pb-24">
  <div class="card-premium border border-navy/10 shadow-2xl">
    <div class="bg-navy p-8 text-white rounded-t-[2rem]">
      <h2 class="text-3xl font-black font-serif">Provision New Session</h2>
      <p class="text-white/60 mt-2">Add a new session to the club schedule.</p>
    </div>

    <form action="{{ url_for('timetables.add_timetable_session') }}" method="POST" class="p-10 space-y-8">
      <div class="space-y-3">
        <label class="text-xs font-black text-accent uppercase tracking-[0.2em] ml-4">Target Group</label>
        <select name="group_id" class="form-input text-lg py-4" required>
          <option value="">-- Select Group --</option>
          {% for g in all_groups %}
          <option value="{{ g.id }}">{{ g.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div class="space-y-3">
          <label class="text-xs font-black text-accent uppercase tracking-[0.2em] ml-4">Day</label>
          <select name="day" class="form-input py-4" required>
            <option value="0">Monday</option>
            <option value="1">Tuesday</option>
            <option value="2">Wednesday</option>
            <option value="3">Thursday</option>
            <option value="4">Friday</option>
            <option value="5">Saturday</option>
            <option value="6">Sunday</option>
          </select>
        </div>
        <div class="space-y-3">
          <label class="text-xs font-black text-accent uppercase tracking-[0.2em] ml-4">Court</label>
          <input type="text" name="court" class="form-input py-4" value="Court 1" required>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div class="space-y-3">
          <label class="text-xs font-black text-accent uppercase tracking-[0.2em] ml-4">Start Time</label>
          <input type="time" name="start_time" class="form-input py-4" required>
        </div>
        <div class="space-y-3">
          <label class="text-xs font-black text-accent uppercase tracking-[0.2em] ml-4">End Time</label>
          <input type="time" name="end_time" class="form-input py-4" required>
        </div>
      </div>

      <div class="flex gap-4 pt-6">
        <a href="{{ url_for('timetables.get_timetable_page') }}" class="btn-outline flex-1 justify-center py-4">Cancel</a>
        <button type="submit" class="btn-primary flex-1 justify-center py-4 shadow-xl">Create Session</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
